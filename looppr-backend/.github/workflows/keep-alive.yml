name: Keep Render backend awake

# Render's free tier spins the service down after ~15 minutes of no
# incoming traffic, and the resulting cold start can exceed the mobile
# app's request timeout (see src/services/api/client.js) -- producing a
# "network error" on the first request after any gap. Pinging /api/health
# every 10 minutes keeps the service warm well inside that window.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' https://looppr-backend.onrender.com/api/health)
          echo "Health check responded $status"
          if [ "$status" != "200" ]; then
            echo "::warning::Backend health check returned $status"
          fi
